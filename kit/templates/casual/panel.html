<!doctype html>
<html data-type="panel" data-width="360" data-height="300" data-style="casual" data-nine-slice="80 70 60 70">
<head>
<!-- Gesso template casual/panel. Popup with a ribbon header; export the ribbon separately if the title width varies.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#241640; --ow:4px; --shadow:rgba(36,22,64,.35); }
.grass { --c1:#1d5410; --c2:#2e8519; --c3:#4fb526; --c4:#86dd45; --c5:#c9f98e; }
.sun { --c1:#7a4100; --c2:#c77d00; --c3:#ffbf14; --c4:#ffe060; --c5:#fff5bf; }
.sky { --c1:#0d3a7a; --c2:#1764cc; --c3:#3894ff; --c4:#86c6ff; --c5:#d8efff; }
.candy { --c1:#6e0f3f; --c2:#b81d6a; --c3:#f74a9d; --c4:#ff9ccd; --c5:#ffd6ea; }
.cream { --c1:#8a6a9e; --c2:#c9b8e0; --c3:#efe8fb; --c4:#fbf8ff; --c5:#ffffff; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-mat-paint cream" style="position:absolute;inset:34px 14px 24px;border-radius:34px;box-shadow:0 0 0 4px #241640, 0 10px 0 0 #c9b8e0, 0 10px 0 4px #241640, 0 18px 18px rgba(36,22,64,.3)"></div>
<div class="g-mat-paint sky" style="position:absolute;inset:58px 34px 46px;border-radius:22px;--c4:#d8efff;--c3:#bfe3ff;--c2:#86c6ff;box-shadow:0 0 0 3px rgba(36,22,64,.25), inset 0 5px 0 rgba(36,22,64,.08)"></div>
<div class="g-mat-candy candy g-gloss" style="position:absolute;left:60px;right:60px;top:10px;height:52px;border-radius:26px;--radius:26px;box-shadow:0 0 0 4px #241640, 0 6px 0 0 #b81d6a, 0 6px 0 4px #241640"></div>
</div></body>
</html>
