<!doctype html>
<html data-type="bar" data-width="360" data-height="48" data-style="sci-fi" data-nine-slice="14 26 14 26">
<head>
<!-- Gesso template sci-fi/bar-frame. Segmented shield or ammo housing.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#04070c; --ow:0px; }
.holo { --c1:#04070c; --c2:#0a1019; --c3:#108aa6; --c4:#22c3e6; --c5:#7fe8ff; }
.bracket { position:absolute; width:18px; height:18px; border:0 solid #7fe8ff; filter: drop-shadow(0 0 4px #22c3e6); }
.amber { --c3:#d98a00; --c4:#ffb52e; --c5:#ffe0a0; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-mat-holo holo g-chamfer g-form" style="position:absolute;inset:8px 6px;--cut:10px"></div>
<div class="g-bar__track" style="left:22px;right:22px;top:17px;bottom:17px;border-radius:0;background:rgba(4,7,12,.9);box-shadow:inset 0 0 0 1px rgba(34,195,230,.45)"></div>
<div style="position:absolute;left:22px;right:22px;bottom:9px;height:4px;background:repeating-linear-gradient(90deg,#22c3e6 0 1px,transparent 1px 16px);opacity:.8"></div>
</div></body>
</html>
