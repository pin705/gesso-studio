<!doctype html>
<html data-type="panel" data-width="360" data-height="260" data-style="sci-fi" data-nine-slice="56 40 40 40">
<head>
<!-- Gesso template sci-fi/panel. HUD panel with a header strip.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#04070c; --ow:0px; }
.holo { --c1:#04070c; --c2:#0a1019; --c3:#108aa6; --c4:#22c3e6; --c5:#7fe8ff; }
.bracket { position:absolute; width:18px; height:18px; border:0 solid #7fe8ff; filter: drop-shadow(0 0 4px #22c3e6); }
.amber { --c3:#d98a00; --c4:#ffb52e; --c5:#ffe0a0; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-mat-holo holo g-chamfer g-form" style="position:absolute;inset:14px;--cut:24px"></div>
<div style="position:absolute;left:38px;right:38px;top:20px;height:26px;background:linear-gradient(180deg,rgba(34,195,230,.32),rgba(34,195,230,.06));clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)"></div>
<div style="position:absolute;left:14px;right:14px;top:52px;height:1px;background:rgba(127,232,255,.55)"></div>
<div style="position:absolute;left:24px;top:24px;width:10px;height:10px;background:#ffb52e;box-shadow:0 0 8px #ffb52e"></div>
<i class="bracket" style="left:6px;top:6px;border-top-width:2.5px;border-left-width:2.5px"></i><i class="bracket" style="right:6px;top:6px;border-top-width:2.5px;border-right-width:2.5px"></i><i class="bracket" style="left:6px;bottom:6px;border-bottom-width:2.5px;border-left-width:2.5px"></i><i class="bracket" style="right:6px;bottom:6px;border-bottom-width:2.5px;border-right-width:2.5px"></i>
</div></body>
</html>
