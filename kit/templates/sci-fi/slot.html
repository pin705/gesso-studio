<!doctype html>
<html data-type="frame" data-width="104" data-height="104" data-style="sci-fi" data-nine-slice="24 24 24 24">
<head>
<!-- Gesso template sci-fi/slot. Ability or inventory slot.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#04070c; --ow:0px; }
.holo { --c1:#04070c; --c2:#0a1019; --c3:#108aa6; --c4:#22c3e6; --c5:#7fe8ff; }
.bracket { position:absolute; width:18px; height:18px; border:0 solid #7fe8ff; filter: drop-shadow(0 0 4px #22c3e6); }
.amber { --c3:#d98a00; --c4:#ffb52e; --c5:#ffe0a0; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-mat-holo holo g-chamfer g-form" style="position:absolute;inset:10px;--cut:16px"></div>
<div class="g-chamfer" style="position:absolute;inset:20px;--cut:10px;background:rgba(4,7,12,.85);box-shadow:inset 0 0 0 1px rgba(34,195,230,.5)"></div>
<i class="bracket" style="left:4px;top:4px;border-top-width:2.5px;border-left-width:2.5px"></i><i class="bracket" style="right:4px;top:4px;border-top-width:2.5px;border-right-width:2.5px"></i><i class="bracket" style="left:4px;bottom:4px;border-bottom-width:2.5px;border-left-width:2.5px"></i><i class="bracket" style="right:4px;bottom:4px;border-bottom-width:2.5px;border-right-width:2.5px"></i>
</div></body>
</html>
