<!doctype html>
<html data-type="button" data-width="400" data-height="156" data-style="cozy" data-nine-slice="44 72 50 96">
<head>
<!-- Gesso template cozy/button. Painted wood sign. Add class "is-pressed" or "is-disabled" to <body> for the other states.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#3a2414; --ow:3px; --shadow:rgba(58,36,20,.38); }
.green { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#a8d77a; }
.wood { --c1:#3a2414; --c2:#5c3a1e; --c3:#8a5a2e; --c4:#b98347; --c5:#dcae6e; }
.paper { --c1:#6b5a45; --c2:#a8916f; --c3:#d8c39c; --c4:#efe1c2; --c5:#fbf4e3; }
.leafy { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#d9f0b0; --ow:2.5px; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-button green" style="--lip:11px;--radius:32px;--lip-color:linear-gradient(135deg,#8a5a2e,#5c3a1e 60%,#3a2414);left:16px;right:16px;top:14px;bottom:36px">
  <div class="g-button__face g-mat-paint g-form"><div class="t-fill" style="inset:9px;border-radius:24px;border:2px solid rgba(217,240,176,.45);box-shadow:inset 2px 2px 0 rgba(255,255,255,.25), inset -2px -3px 0 rgba(31,61,28,.5)"></div></div>
</div>
<div class="t-nail" style="left:350px;top:62px"></div>
<div class="g-icon leafy" style="--icon:url(/kit/icons/game-icons/three-leaves.svg);inset:auto;left:4px;top:-6px;width:70px;height:70px;transform:rotate(-20deg);"><i class="g-icon__base g-mat-paint"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div>
<div class="t-nail" style="left:36px;top:30px;--nail-hi:#f7b98f;--nail:#d0543f;--nail-lo:#9b2e30"></div>
</div></body>
</html>
