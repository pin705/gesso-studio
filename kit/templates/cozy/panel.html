<!doctype html>
<html data-type="panel" data-width="360" data-height="288" data-style="cozy" data-nine-slice="56 52 56 52">
<head>
<!-- Gesso template cozy/panel. Notice board: wood frame, paper well.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#3a2414; --ow:3px; --shadow:rgba(58,36,20,.38); }
.green { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#a8d77a; }
.wood { --c1:#3a2414; --c2:#5c3a1e; --c3:#8a5a2e; --c4:#b98347; --c5:#dcae6e; }
.paper { --c1:#6b5a45; --c2:#a8916f; --c3:#d8c39c; --c4:#efe1c2; --c5:#fbf4e3; }
.leafy { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#d9f0b0; --ow:2.5px; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-panel g-mat-wood wood" style="--radius:28px;--frame:24px;inset:10px 10px 18px"><div class="g-panel__content g-mat-paper paper" style="--radius:18px"></div></div>
<div class="t-nail" style="left:18px;top:18px"></div><div class="t-nail" style="left:328px;top:18px"></div><div class="t-nail" style="left:18px;top:248px"></div><div class="t-nail" style="left:328px;top:248px"></div>
<div class="g-icon leafy" style="--icon:url(/kit/icons/game-icons/three-leaves.svg);inset:auto;left:290px;top:-8px;width:52px;height:52px;transform:rotate(30deg);"><i class="g-icon__base g-mat-paint"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div>
</div></body>
</html>
