<!doctype html>
<html data-type="bar" data-width="360" data-height="72" data-style="cozy" data-nine-slice="20 28 20 76">
<head>
<!-- Gesso template cozy/bar-frame. Housing with a recessed track; the fill is bar-fill.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#3a2414; --ow:3px; --shadow:rgba(58,36,20,.38); }
.green { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#a8d77a; }
.wood { --c1:#3a2414; --c2:#5c3a1e; --c3:#8a5a2e; --c4:#b98347; --c5:#dcae6e; }
.paper { --c1:#6b5a45; --c2:#a8916f; --c3:#d8c39c; --c4:#efe1c2; --c5:#fbf4e3; }
.leafy { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#d9f0b0; --ow:2.5px; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-mat-wood wood g-form" style="position:absolute;left:12px;right:8px;top:12px;bottom:14px;border-radius:24px;box-shadow:0 0 0 3px #3a2414,0 6px 8px rgba(58,36,20,.35)"></div>
<div class="g-bar__track g-well wood" style="left:62px;right:22px;top:21px;bottom:24px;box-shadow:0 0 0 2px #3a2414, inset 0 4px 5px rgba(0,0,0,.6)"></div>
<div class="g-icon" style="--icon:url(/kit/icons/game-icons/sun.svg);inset:auto;left:2px;top:2px;width:66px;height:66px;--c1:#6e4310;--c2:#b5791f;--c3:#e8b341;--c4:#fbe08a;--c5:#fff6d0;--c6:#fff6d0;transform:rotate(0deg);"><i class="g-icon__base g-mat-gold g-form"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div>
</div></body>
</html>
