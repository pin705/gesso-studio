<!doctype html>
<html data-type="button" data-width="380" data-height="132" data-style="xianxia" data-nine-slice="36 90 40 90">
<head>
<!-- Gesso template xianxia/button. Jade plaque with gold xiangyun caps. Add "is-pressed" or "is-disabled" to <body> for states.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#0e1113; --ow:2.5px; --shadow:rgba(12,46,48,.4); }
.jade { --c1:#0c2e30; --c2:#154b45; --c3:#20705f; --c4:#3a977d; --c5:#78c7a5; --c6:#d3f0dc; }
.gold { --c1:#3a1e08; --c2:#6b3b10; --c3:#a86a1f; --c4:#d9a441; --c5:#f3d27c; --c6:#fff4d2; }
.lacquer { --c1:#3b0d0d; --c2:#6e1a17; --c3:#a52b22; --c4:#d0493a; --c5:#ee8a6b; }
.silk { --c1:#8f7a55; --c2:#c2ae85; --c3:#e0d3b4; --c4:#f3ecdb; --c5:#fffaf0; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-mat-gold gold" style="position:absolute;left:44px;right:44px;top:22px;bottom:30px;border-radius:18px;box-shadow:0 0 0 2.5px #0e1113, 0 7px 8px rgba(12,46,48,.4)"></div>
<div class="g-mat-jade jade face" style="position:absolute;left:50px;right:50px;top:28px;bottom:36px;border-radius:13px;box-shadow:0 0 0 2px #3a1e08"></div>
<div class="g-icon" style="--icon:url(/kit/icons/game-icons/fluffy-swirl.svg);inset:auto;left:6px;top:22px;width:80px;height:80px;--c1:#3a1e08;--c2:#6b3b10;--c3:#a86a1f;--c4:#d9a441;--c5:#f3d27c;--c6:#fff4d2;transform:rotate(0deg);"><i class="g-icon__base g-mat-gold"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div><div class="g-icon" style="--icon:url(/kit/icons/game-icons/fluffy-swirl.svg);inset:auto;left:294px;top:22px;width:80px;height:80px;--c1:#3a1e08;--c2:#6b3b10;--c3:#a86a1f;--c4:#d9a441;--c5:#f3d27c;--c6:#fff4d2;transform:rotate(0deg);scale:-1 1"><i class="g-icon__base g-mat-gold"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div>
<style>.is-pressed .face { filter: brightness(.85); }</style>
</div></body>
</html>
