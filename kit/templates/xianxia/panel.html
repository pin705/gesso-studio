<!doctype html>
<html data-type="panel" data-width="360" data-height="300" data-style="xianxia" data-nine-slice="60 50 60 50">
<head>
<!-- Gesso template xianxia/panel. Lacquer frame, gold border, silk well, lotus crest.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#0e1113; --ow:2.5px; --shadow:rgba(12,46,48,.4); }
.jade { --c1:#0c2e30; --c2:#154b45; --c3:#20705f; --c4:#3a977d; --c5:#78c7a5; --c6:#d3f0dc; }
.gold { --c1:#3a1e08; --c2:#6b3b10; --c3:#a86a1f; --c4:#d9a441; --c5:#f3d27c; --c6:#fff4d2; }
.lacquer { --c1:#3b0d0d; --c2:#6e1a17; --c3:#a52b22; --c4:#d0493a; --c5:#ee8a6b; }
.silk { --c1:#8f7a55; --c2:#c2ae85; --c3:#e0d3b4; --c4:#f3ecdb; --c5:#fffaf0; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-mat-lacquer lacquer" style="position:absolute;inset:16px 14px 22px;border-radius:14px;box-shadow:0 0 0 2.5px #0e1113, 0 10px 14px rgba(12,46,48,.45)"></div>
<div class="g-mat-gold gold" style="position:absolute;inset:28px 26px 34px;border-radius:9px"></div>
<div class="g-mat-paper silk" style="position:absolute;inset:34px 32px 40px;border-radius:6px;box-shadow:inset 0 5px 8px rgba(59,13,13,.3)"></div>
<div class="g-icon" style="--icon:url(/kit/icons/game-icons/lotus.svg);inset:auto;left:150px;top:-4px;width:60px;height:60px;--c1:#3a1e08;--c2:#6b3b10;--c3:#a86a1f;--c4:#d9a441;--c5:#f3d27c;--c6:#fff4d2;transform:rotate(0deg);"><i class="g-icon__base g-mat-gold"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div>
</div></body>
</html>
