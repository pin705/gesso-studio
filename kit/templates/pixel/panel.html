<!doctype html>
<html data-type="panel" data-width="256" data-height="192" data-style="pixel" data-nine-slice="48 24 28 24">
<head>
<!-- Gesso template pixel/panel. Pixel window with a title strip.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#1a1c2c; --px:4px; }
.pgreen { --c2:#257179; --c3:#38b764; --c4:#a7f070; --c5:#a7f070; }
.pblue { --c2:#29366f; --c3:#3b5dc9; --c4:#41a6f6; --c5:#73eff7; }
.pdark { --c2:#1a1c2c; --c3:#333c57; --c4:#566c86; --c5:#94b0c2; }
.pred { --c2:#5d275d; --c3:#b13e53; --c4:#ef7d57; --c5:#ffcd75; }
body { image-rendering: pixelated; }
</style>
</head>
<body><div class="g-canvas">
<div class="t-pixel-outline" style="position:absolute;inset:8px 8px 12px">
  <div class="t-pixel pdark" style="position:absolute;inset:0;background:var(--c3)"></div>
  <div style="position:absolute;inset:12px;background:#1a1c2c;box-shadow:0 0 0 4px #566c86, inset -4px -4px 0 #333c57"></div>
  <div style="position:absolute;left:12px;right:12px;top:12px;height:24px;background:#3b5dc9;box-shadow:inset 0 4px 0 #41a6f6, inset 0 -4px 0 #29366f"></div>
  <i style="position:absolute;left:4px;top:4px;width:4px;height:4px;background:#f4f4f4"></i><i style="position:absolute;right:4px;top:4px;width:4px;height:4px;background:#f4f4f4"></i>
  <i style="position:absolute;left:4px;bottom:4px;width:4px;height:4px;background:#94b0c2"></i><i style="position:absolute;right:4px;bottom:4px;width:4px;height:4px;background:#94b0c2"></i>
</div>
</div></body>
</html>
