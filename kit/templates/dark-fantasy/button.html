<!doctype html>
<html data-type="button" data-width="320" data-height="110" data-style="dark-fantasy" data-nine-slice="30 44 30 44">
<head>
<!-- Gesso template dark-fantasy/button. Forged iron plate with a blood enamel face. Add "is-pressed" or "is-disabled" to <body> for states.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#0b0d10; --ow:2.5px; --shadow:rgba(0,0,0,.6); }
.iron { --c1:#0b0d10; --c2:#1b2026; --c3:#323a44; --c4:#56606b; --c5:#9aa3aa; }
.blood { --c1:#1f0405; --c2:#4a0b0d; --c3:#7d1414; --c4:#b0221c; --c5:#d94a2b; }
.bone { --c1:#2b241a; --c2:#4d4231; --c3:#7a6c52; --c4:#aa9b7b; --c5:#d6cbb0; }
.outlined { filter: drop-shadow(2.5px 0 0 #0b0d10) drop-shadow(-2.5px 0 0 #0b0d10) drop-shadow(0 2.5px 0 #0b0d10) drop-shadow(0 -2.5px 0 #0b0d10) drop-shadow(0 7px 6px rgba(0,0,0,.6)); }
.rivet { --nail-hi:#e8edf1; --nail:#56606b; --nail-lo:#323a44; --n:11px; }
</style>
</head>
<body><div class="g-canvas">
<div class="outlined" style="position:absolute;inset:14px 10px 18px">
  <div class="g-mat-iron iron g-chamfer" style="position:absolute;inset:0;--cut:14px"></div>
  <div class="g-mat-lacquer blood g-chamfer" style="position:absolute;inset:11px 26px;--cut:8px;box-shadow:none"></div>
</div>

<div class="t-nail rivet" style="left:22px;top:50px"></div><div class="t-nail rivet" style="left:287px;top:50px"></div>
<style>.is-pressed .g-mat-lacquer { filter: brightness(.8); transform: translateY(2px); }</style>
</div></body>
</html>
