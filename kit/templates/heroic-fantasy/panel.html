<!doctype html>
<html data-type="panel" data-width="360" data-height="288" data-style="heroic-fantasy" data-nine-slice="52 52 60 52">
<head>
<!-- Gesso template heroic-fantasy/panel. Carved wood, gold trim, ruby corners.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#24130a; --ow:3px; --shadow:rgba(36,19,10,.45); }
.gold { --c1:#4a2806; --c2:#7d4a0f; --c3:#b87a1c; --c4:#eab13a; --c5:#ffdf86; --c6:#fff6d8; }
.royal { --c1:#0c1a45; --c2:#172f7a; --c3:#2553b8; --c4:#4f86e8; --c5:#9cc2ff; }
.wood { --c1:#2e1a0d; --c2:#4d2f18; --c3:#764a27; --c4:#a26c3c; --c5:#c99563; }
.leaf { --c1:#12330f; --c2:#24591d; --c3:#3f8a2e; --c4:#6cbf45; --c5:#b2e67f; }
.paper { --c1:#6b5a45; --c2:#a8916f; --c3:#d8c39c; --c4:#efe1c2; --c5:#fbf4e3; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-panel g-mat-wood wood" style="--radius:22px;--frame:24px;inset:12px 12px 20px">
  <div class="t-fill g-mat-gold gold" style="inset:14px;border-radius:14px;--radius:14px"></div>
  <div class="g-panel__content g-mat-paper paper" style="--radius:12px;inset:20px"></div>
</div><div class="t-gem" style="left:14px;top:14px;--g:22px;--gem-hi:#ff6a7c;--gem:#b8142f;--gem-lo:#5c0617"></div><div class="t-gem" style="left:322px;top:14px;--g:22px;--gem-hi:#ff6a7c;--gem:#b8142f;--gem-lo:#5c0617"></div><div class="t-gem" style="left:14px;top:244px;--g:22px;--gem-hi:#ff6a7c;--gem:#b8142f;--gem-lo:#5c0617"></div><div class="t-gem" style="left:322px;top:244px;--g:22px;--gem-hi:#ff6a7c;--gem:#b8142f;--gem-lo:#5c0617"></div>
</div></body>
</html>
