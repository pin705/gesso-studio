<!doctype html>
<html data-type="bar" data-width="360" data-height="64" data-style="heroic-fantasy" data-nine-slice="18 24 18 64">
<head>
<!-- Gesso template heroic-fantasy/bar-frame. Gold housing with a star cap.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#24130a; --ow:3px; --shadow:rgba(36,19,10,.45); }
.gold { --c1:#4a2806; --c2:#7d4a0f; --c3:#b87a1c; --c4:#eab13a; --c5:#ffdf86; --c6:#fff6d8; }
.royal { --c1:#0c1a45; --c2:#172f7a; --c3:#2553b8; --c4:#4f86e8; --c5:#9cc2ff; }
.wood { --c1:#2e1a0d; --c2:#4d2f18; --c3:#764a27; --c4:#a26c3c; --c5:#c99563; }
.leaf { --c1:#12330f; --c2:#24591d; --c3:#3f8a2e; --c4:#6cbf45; --c5:#b2e67f; }
.paper { --c1:#6b5a45; --c2:#a8916f; --c3:#d8c39c; --c4:#efe1c2; --c5:#fbf4e3; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-mat-gold gold" style="position:absolute;left:30px;right:10px;top:12px;bottom:14px;border-radius:20px;box-shadow:0 0 0 3px #24130a,0 5px 6px rgba(36,19,10,.4)"></div>
<div class="g-bar__track g-well" style="left:52px;right:22px;top:20px;bottom:22px;border-radius:12px;box-shadow:0 0 0 2px #24130a, inset 0 4px 5px rgba(0,0,0,.6)"></div><div class="g-icon" style="--icon:url(/kit/icons/game-icons/polar-star.svg);inset:auto;left:0px;top:2px;width:60px;height:60px;--c1:#4a2806;--c2:#7d4a0f;--c3:#b87a1c;--c4:#eab13a;--c5:#ffdf86;--c6:#fff6d8;transform:rotate(0deg);"><i class="g-icon__base g-mat-gold"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div>
</div></body>
</html>
