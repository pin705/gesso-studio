<!doctype html>
<html data-type="button" data-width="360" data-height="128" data-style="heroic-fantasy" data-nine-slice="40 56 44 56">
<head>
<!-- Gesso template heroic-fantasy/button. Gold-rimmed royal enamel with gem caps. Add class "is-pressed" or "is-disabled" to <body> for the other states.
     Copy it into your project with save_asset, then swap the ramps in :root for your art bible's. -->
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
:root { --outline:#24130a; --ow:3px; --shadow:rgba(36,19,10,.45); }
.gold { --c1:#4a2806; --c2:#7d4a0f; --c3:#b87a1c; --c4:#eab13a; --c5:#ffdf86; --c6:#fff6d8; }
.royal { --c1:#0c1a45; --c2:#172f7a; --c3:#2553b8; --c4:#4f86e8; --c5:#9cc2ff; }
.wood { --c1:#2e1a0d; --c2:#4d2f18; --c3:#764a27; --c4:#a26c3c; --c5:#c99563; }
.leaf { --c1:#12330f; --c2:#24591d; --c3:#3f8a2e; --c4:#6cbf45; --c5:#b2e67f; }
.paper { --c1:#6b5a45; --c2:#a8916f; --c3:#d8c39c; --c4:#efe1c2; --c5:#fbf4e3; }
</style>
</head>
<body><div class="g-canvas">
<div class="g-button gold" style="--lip:8px;--radius:26px;--lip-color:linear-gradient(180deg,#7d4a0f,#4a2806);left:18px;right:18px;top:14px;bottom:30px">
  <div class="g-button__face g-mat-gold"><div class="t-fill g-mat-paint royal g-gloss" style="inset:9px;border-radius:18px;--radius:18px"></div></div>
</div>
<div class="t-gem" style="left:24px;top:47px;--g:24px"></div><div class="t-gem" style="left:312px;top:47px;--g:24px"></div>
</div></body>
</html>
