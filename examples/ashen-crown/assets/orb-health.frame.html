<!doctype html>
<html data-type="frame" data-width="200" data-height="216" data-style="dark-fantasy">
<head>
<link rel="stylesheet" href="/kit/gesso.css">
<link rel="stylesheet" href="/kit/templates.css">
<style>
  :root { --outline:#0b0d10; --ow:2.5px; --shadow:rgba(11,13,16,.6); }
  .iron { --c1:#0b0d10; --c2:#171b20; --c3:#262c33; --c4:#3c444d; --c5:#5f6973; --c6:#9aa3aa; }
  .gold { --c1:#3a2410; --c2:#3a2410; --c3:#6b4518; --c4:#a8742a; --c5:#d8a84e; --c6:#f2d692; }
  .bone { --c1:#2b241a; --c2:#4d4231; --c3:#7a6c52; --c4:#aa9b7b; --c5:#d6cbb0; }
  .blood { --c1:#1f0405; --c2:#4a0b0d; --c3:#7d1414; --c4:#b0221c; --c5:#d94a2b; }
  .arcane { --c1:#120c24; --c2:#251a4a; --c3:#3f2d7a; --c4:#6a52c4; --c5:#a894f0; --c6:#dcd2ff; }
  .ember { --c1:#4a0b0d; --c2:#b0221c; --c3:#e8561e; --c4:#ff9a3c; --c5:#ffd9a0; --c6:#ffd9a0; }
  .outlined { filter: drop-shadow(2.5px 0 0 #0b0d10) drop-shadow(-2.5px 0 0 #0b0d10) drop-shadow(0 2.5px 0 #0b0d10) drop-shadow(0 -2.5px 0 #0b0d10) drop-shadow(0 6px 5px rgba(11,13,16,.6)); }
  .rivet { --nail-hi:#c7ccd0; --nail:#5f6973; --nail-lo:#262c33; --n:10px; }
  .rivet.gilt { --nail-hi:#f2d692; --nail:#a8742a; --nail-lo:#6b4518; }

</style>
</head>
<body><div class="g-canvas">
<!-- heavy plain base -->
<div class="outlined" style="position:absolute;left:44px;right:44px;top:178px;height:30px"><div class="g-mat-iron iron" style="position:absolute;inset:0;clip-path:polygon(14% 0,86% 0,100% 100%,0 100%)"></div></div>
<!-- ring: hammered iron annulus -->
<div class="outlined" style="position:absolute;left:8px;top:20px;width:184px;height:184px">
  <div class="g-mat-iron iron" style="position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 67px,#000 68px);mask:radial-gradient(circle,transparent 67px,#000 68px)"></div>
</div>
<div style="position:absolute;left:31px;top:43px;width:138px;height:138px;border-radius:50%;box-shadow:0 0 0 2px #0b0d10, inset 0 0 0 2px rgba(154,163,170,.35)"></div>
<div class="t-nail rivet" style="left:175.0px;top:107.0px"></div><div class="t-nail rivet" style="left:151.6px;top:163.6px"></div><div class="t-nail rivet" style="left:95.0px;top:187.0px"></div><div class="t-nail rivet" style="left:38.4px;top:163.6px"></div><div class="t-nail rivet" style="left:15.0px;top:107.0px"></div><div class="t-nail rivet" style="left:38.4px;top:50.4px"></div><div class="t-nail rivet" style="left:95.0px;top:27.0px"></div><div class="t-nail rivet" style="left:151.6px;top:50.4px"></div>
<!-- occlusion on the liquid and glass highlight -->
<div style="position:absolute;left:32px;top:44px;width:136px;height:136px;border-radius:50%;background:radial-gradient(circle at 50% 50%,transparent 56%,rgba(11,13,16,.75) 72%)"></div>
<div style="position:absolute;left:44px;top:54px;width:96px;height:96px;border-radius:50%;border:4px solid transparent;border-top-color:rgba(199,204,208,.5);border-left-color:rgba(199,204,208,.3);transform:rotate(-12deg);filter:blur(.6px)"></div>
<div style="position:absolute;left:62px;top:66px;width:10px;height:10px;border-radius:50%;background:rgba(242,244,246,.8);filter:blur(1px)"></div>
<!-- crown clasp: ornament clusters at the top -->
<div class="g-icon gold" style="--icon:url(/kit/icons/game-icons/sharp-crown.svg);inset:auto;left:56px;top:-2px;width:88px;height:56px;filter:drop-shadow(0 3px 3px rgba(11,13,16,.6))"><i class="g-icon__base g-mat-gold"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i><i class="g-icon__edge"></i></div>
<div class="t-gem" style="left:91px;top:30px;--g:18px;--gem-hi:#d94a2b;--gem:#b0221c;--gem-lo:#4a0b0d"></div>
</div></body>
</html>
