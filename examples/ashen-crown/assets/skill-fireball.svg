<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" data-type="icon" data-style="dark-fantasy">
  <defs>
    <radialGradient id="skill-fireball-bg" cx="64" cy="60" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b241a"/><stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <filter id="skill-fireball-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="skill-fireball-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="skill-fireball-tile"><rect width="128" height="128" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#skill-fireball-tile)">
    <rect width="128" height="128" fill="url(#skill-fireball-bg)"/>
    <!-- smoke trail, dirty edges -->
    <path d="M4 124 C20 96 36 88 58 74 C44 96 30 110 18 128 Z" fill="#171b20" opacity=".8"/>
    <!-- flame tongues licking back toward the bottom-left -->
    <path d="M20 112 C34 92 44 84 60 70 C52 88 40 100 26 116 Z" fill="#b0221c"/>
    <path d="M30 100 C44 86 54 78 66 68 C60 84 50 94 38 104 Z" fill="#e8561e"/>
    <circle cx="76" cy="54" r="40" fill="#e8561e" opacity=".5" filter="url(#skill-fireball-blur)"/>
    <circle cx="76" cy="54" r="30" fill="#b0221c"/>
    <circle cx="78" cy="52" r="24" fill="#e8561e"/>
    <circle cx="80" cy="50" r="16" fill="#ff9a3c" filter="url(#skill-fireball-soft)"/>
    <circle cx="82" cy="48" r="9" fill="#ffd9a0" filter="url(#skill-fireball-soft)"/>
    <path d="M52 40 C58 26 72 20 86 22" fill="none" stroke="#ffd9a0" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <g fill="#ffd9a0"><circle cx="104" cy="30" r="2"/><circle cx="110" cy="70" r="1.5"/><circle cx="44" cy="58" r="1.8"/></g>
    <rect x="1.5" y="1.5" width="125" height="125" rx="5" fill="none" stroke="#0b0d10" stroke-width="3"/>
  </g>
</svg>
