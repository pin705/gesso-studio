<svg xmlns="http://www.w3.org/2000/svg" width="200" height="216" viewBox="0 0 200 216" data-type="bar" data-style="dark-fantasy">
  <defs>
    <linearGradient id="orb-health.frame-iron" x1="30" y1="20" x2="170" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa3aa"/><stop offset=".18" stop-color="#5f6973"/><stop offset=".5" stop-color="#262c33"/><stop offset=".78" stop-color="#3c444d"/><stop offset="1" stop-color="#171b20"/>
    </linearGradient>
    <linearGradient id="orb-health.frame-gold" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2d692"/><stop offset=".35" stop-color="#d8a84e"/><stop offset=".7" stop-color="#6b4518"/><stop offset="1" stop-color="#3a2410"/>
    </linearGradient>
    <radialGradient id="orb-health.frame-inner" cx="100" cy="100" r="68" gradientUnits="userSpaceOnUse">
      <stop offset=".86" stop-color="#0b0d10" stop-opacity="0"/><stop offset="1" stop-color="#0b0d10" stop-opacity=".85"/>
    </radialGradient>
    <filter id="orb-health.frame-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0b0d10" flood-opacity=".6"/></filter>
    <filter id="orb-health.frame-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="12"/>
      <feColorMatrix values="0 0 0 0 .04  0 0 0 0 .05  0 0 0 0 .06  .9 0 0 0 -.3"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode/></feMerge>
    </filter>
  </defs>
  <g filter="url(#orb-health.frame-shadow)">
    <!-- heavy bottom bracket -->
    <path d="M58 170 L142 170 L154 204 L46 204 Z" fill="#171b20" stroke="#0b0d10" stroke-width="3" stroke-linejoin="round"/>
    <path d="M62 176 L138 176" stroke="#5f6973" stroke-width="2" stroke-linecap="round"/>
    <!-- iron ring with a transparent window -->
    <path d="M100 10 A90 90 0 1 1 99.9 10 Z M100 34 A66 66 0 1 0 100.1 34 Z" fill="url(#orb-health.frame-iron)" fill-rule="evenodd" stroke="#0b0d10" stroke-width="3" filter="url(#orb-health.frame-grain)"/>
    <circle cx="100" cy="100" r="66" fill="none" stroke="#0b0d10" stroke-width="4"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#171b20" stroke-width="2" opacity=".8"/>
    <!-- worn edge scratches on the lit rim -->
    <path d="M36 70 A70 70 0 0 1 72 30" fill="none" stroke="#c7ccd0" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <path d="M24 108 A76 76 0 0 1 28 84" fill="none" stroke="#9aa3aa" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
    <path d="M150 172 A88 88 0 0 0 184 124" fill="none" stroke="#7b848c" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <g transform="translate(171.4 128.8)"><circle r="5" fill="#0b0d10"/><circle r="3.6" fill="#3c444d"/><circle cx="-1.2" cy="-1.2" r="1.3" fill="#c7ccd0"/></g><g transform="translate(130.1 170.9)"><circle r="5" fill="#0b0d10"/><circle r="3.6" fill="#3c444d"/><circle cx="-1.2" cy="-1.2" r="1.3" fill="#c7ccd0"/></g><g transform="translate(71.2 171.4)"><circle r="5" fill="#0b0d10"/><circle r="3.6" fill="#3c444d"/><circle cx="-1.2" cy="-1.2" r="1.3" fill="#c7ccd0"/></g><g transform="translate(29.1 130.1)"><circle r="5" fill="#0b0d10"/><circle r="3.6" fill="#3c444d"/><circle cx="-1.2" cy="-1.2" r="1.3" fill="#c7ccd0"/></g><g transform="translate(28.6 71.2)"><circle r="5" fill="#0b0d10"/><circle r="3.6" fill="#3c444d"/><circle cx="-1.2" cy="-1.2" r="1.3" fill="#c7ccd0"/></g><g transform="translate(69.9 29.1)"><circle r="5" fill="#0b0d10"/><circle r="3.6" fill="#3c444d"/><circle cx="-1.2" cy="-1.2" r="1.3" fill="#c7ccd0"/></g><g transform="translate(128.8 28.6)"><circle r="5" fill="#0b0d10"/><circle r="3.6" fill="#3c444d"/><circle cx="-1.2" cy="-1.2" r="1.3" fill="#c7ccd0"/></g><g transform="translate(170.9 69.9)"><circle r="5" fill="#0b0d10"/><circle r="3.6" fill="#3c444d"/><circle cx="-1.2" cy="-1.2" r="1.3" fill="#c7ccd0"/></g>
    <!-- gothic crown in old gold -->
    <g transform="translate(100 0)" stroke="#0b0d10" stroke-width="3" stroke-linejoin="round">
      <path d="M-40 34 L-30 10 L-18 24 L0 -2 L18 24 L30 10 L40 34 Q0 22 -40 34 Z" fill="url(#orb-health.frame-gold)"/>
      <circle cx="0" cy="18" r="6" fill="#b0221c"/>
    </g>
    <path d="M80 26 L100 4" stroke="#f2d692" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
    <circle cx="98" cy="16" r="2" fill="#ff9a3c"/>
  </g>
  <!-- glass over the window: dark rim and a curved highlight -->
  <circle cx="100" cy="100" r="66" fill="url(#orb-health.frame-inner)"/>
  <path d="M52 86 A50 50 0 0 1 96 50 A56 56 0 0 0 58 96 Z" fill="#d6cbb0" opacity=".45"/>
  <circle cx="64" cy="102" r="3" fill="#d6cbb0" opacity=".5"/>
</svg>
