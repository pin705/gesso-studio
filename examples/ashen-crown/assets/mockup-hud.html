<!doctype html>
<html data-type="mockup" data-width="960" data-height="320" data-style="dark-fantasy">
<head>
<link rel="stylesheet" href="/kit/gesso.css">
<style>
  :root { --outline: #0b0d10; --ow: 2px; }
  body { background: #0b0d10; }
  iframe { position: absolute; border: 0; background: transparent; color-scheme: normal; }
  /* stand-in for gameplay: a dim crypt floor lit by two braziers, kept soft so the HUD reads on top */
  .scene { position: absolute; inset: 0; filter: blur(1.5px) brightness(.8); }
  .floor { position: absolute; inset: 0; background: url(/kit/textures/stone.svg) 0 0 / 420px, linear-gradient(180deg, #262c33, #171b20 55%, #0b0d10); background-blend-mode: multiply, normal; }
  .pool { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(232,86,30,.45), rgba(107,69,24,.2) 60%, transparent); }
  .bowl { position: absolute; width: 76px; height: 24px; clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%); --c1:#0b0d10; --c2:#171b20; --c3:#262c33; --c4:#3c444d; --c5:#5f6973; --c6:#9aa3aa; }
  .stem { position: absolute; width: 12px; height: 86px; background: linear-gradient(90deg, #0b0d10, #3c444d 40%, #171b20); }
  .shelf { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, transparent, rgba(11,13,16,.9) 45%); }
  .key { position: absolute; font: 700 15px Cinzel, serif; color: #d6cbb0; -webkit-text-stroke: 3px #0b0d10; paint-order: stroke fill; }
</style>
</head>
<body>
  <div class="scene">
    <div class="floor"></div>
    <div class="pool" style="left:220px;top:60px;width:260px;height:150px"></div>
    <div class="pool" style="left:510px;top:60px;width:260px;height:150px"></div>
  </div>
  <iframe src="vfx-brazier.html" style="left:272px;top:-6px;width:256px;height:256px;transform:scale(.5);transform-origin:0 0" scrolling="no"></iframe>
  <iframe src="vfx-brazier.html" style="left:562px;top:-6px;width:256px;height:256px;transform:scale(.5);transform-origin:0 0" scrolling="no"></iframe>
  <div class="stem" style="left:330px;top:118px"></div><div class="bowl g-mat-iron" style="left:298px;top:100px"></div>
  <div class="stem" style="left:620px;top:118px"></div><div class="bowl g-mat-iron" style="left:588px;top:100px"></div>
  <div class="shelf"></div>

  <!-- health and mana orbs: the fill sits behind the frame, clipped to the current level -->
  <iframe src="orb-health.fill.html" style="left:44px;top:146px;width:132px;height:132px;clip-path:inset(28% 0 0 0)" scrolling="no"></iframe>
  <iframe src="orb-health.frame.html" style="left:10px;top:100px;width:200px;height:216px" scrolling="no"></iframe>
  <iframe src="orb-mana.fill.html" style="left:784px;top:146px;width:132px;height:132px;clip-path:inset(52% 0 0 0)" scrolling="no"></iframe>
  <iframe src="orb-mana.frame.html" style="left:750px;top:100px;width:200px;height:216px" scrolling="no"></iframe>

  <!-- skill bar: an iron plate carrying four slots -->
  <div class="g-mat-iron g-chamfer" style="position:absolute;left:286px;top:222px;width:388px;height:90px;--cut:10px;--c1:#0b0d10;--c2:#171b20;--c3:#262c33;--c4:#3c444d;--c5:#5f6973;--c6:#9aa3aa;box-shadow:none;filter:drop-shadow(0 0 0 #0b0d10) drop-shadow(0 6px 8px rgba(11,13,16,.8))"></div>
  <iframe src="slot-item.html" style="left:294px;top:219px;width:96px;height:96px" scrolling="no"></iframe>
  <iframe src="slot-item.rare.html" style="left:386px;top:219px;width:96px;height:96px" scrolling="no"></iframe>
  <iframe src="slot-item.html" style="left:478px;top:219px;width:96px;height:96px" scrolling="no"></iframe>
  <iframe src="slot-item.legendary.html" style="left:570px;top:219px;width:96px;height:96px" scrolling="no"></iframe>
  <iframe src="skill-cleave.html" style="left:311px;top:236px;width:128px;height:128px;transform:scale(.484);transform-origin:0 0" scrolling="no"></iframe>
  <iframe src="skill-fireball.html" style="left:403px;top:236px;width:128px;height:128px;transform:scale(.484);transform-origin:0 0" scrolling="no"></iframe>
  <iframe src="skill-bone-shield.html" style="left:495px;top:236px;width:128px;height:128px;transform:scale(.484);transform-origin:0 0" scrolling="no"></iframe>
  <iframe src="item-potion-health.html" style="left:585px;top:234px;width:128px;height:128px;transform:scale(.52);transform-origin:0 0" scrolling="no"></iframe>
  <div class="key" style="left:306px;top:228px">1</div><div class="key" style="left:398px;top:228px">2</div>
  <div class="key" style="left:490px;top:228px">3</div><div class="key" style="left:582px;top:228px">Q</div>

  <!-- menu button with an engine-style label -->
  <iframe src="btn-iron.html" style="left:628px;top:8px;width:320px;height:96px;transform:scale(.8);transform-origin:100% 0" scrolling="no"></iframe>
  <div class="g-label" style="position:absolute;left:692px;top:37px;width:256px;text-align:center;--font:'Cinzel';font-weight:700;font-size:18px;letter-spacing:.14em;--label:#d6cbb0;--outline:#0b0d10">INVENTORY</div>
</body>
</html>
