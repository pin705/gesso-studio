<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" data-type="icon" data-style="dark-fantasy" data-bleed="true">
  <defs>
    <radialGradient id="skill-bone-shield-bg" cx="64" cy="60" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#251a4a"/><stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <filter id="skill-bone-shield-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="skill-bone-shield-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="skill-bone-shield-tile"><rect width="128" height="128" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#skill-bone-shield-tile)">
    <rect width="128" height="128" fill="url(#skill-bone-shield-bg)"/>
    <radialGradient id="skill-bone-shield-halo" cx="64" cy="64" r="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6a52c4" stop-opacity=".9"/><stop offset="1" stop-color="#6a52c4" stop-opacity="0"/></radialGradient>
    <circle cx="64" cy="64" r="60" fill="url(#skill-bone-shield-halo)"/>
    <clipPath id="skill-bone-shield-plate"><path d="M64 16 C80 22 96 22 104 20 C106 56 96 90 64 114 C32 90 22 56 24 20 C32 22 48 22 64 16 Z"/></clipPath>
    <path d="M64 16 C80 22 96 22 104 20 C106 56 96 90 64 114 C32 90 22 56 24 20 C32 22 48 22 64 16 Z" fill="#aa9b7b" stroke="#0b0d10" stroke-width="4" stroke-linejoin="round"/>
    <g clip-path="url(#skill-bone-shield-plate)">
      <!-- vertical bone slats: light on the left of each, shadow on the right -->
      <g fill="none" stroke="#d6cbb0" stroke-width="9" stroke-linecap="round"><path d="M30 22 C28 50 29 80 32 104" /><path d="M44 22 C42 50 43 80 46 104" /><path d="M58 22 C56 50 57 80 60 104" /><path d="M72 22 C70 50 71 80 74 104" /><path d="M86 22 C84 50 85 80 88 104" /></g>
      <g fill="none" stroke="#4d4231" stroke-width="2.5" stroke-linecap="round" transform="translate(6 0)"><path d="M30 22 C28 50 29 80 32 104" /><path d="M44 22 C42 50 43 80 46 104" /><path d="M58 22 C56 50 57 80 60 104" /><path d="M72 22 C70 50 71 80 74 104" /><path d="M86 22 C84 50 85 80 88 104" /></g>
      <path d="M64 16 C80 22 96 22 104 20 C106 56 96 90 64 114 Z" fill="#251a4a" opacity=".35"/>
      <!-- knuckle ends make the slats read as bone, not planks -->
      <g fill="#d6cbb0" stroke="#4d4231" stroke-width="1.5"><circle cx="27" cy="30" r="5"/><circle cx="34" cy="30" r="5"/><circle cx="41" cy="26" r="5"/><circle cx="48" cy="26" r="5"/><circle cx="55" cy="24" r="5"/><circle cx="62" cy="24" r="5"/><circle cx="69" cy="24" r="5"/><circle cx="76" cy="24" r="5"/><circle cx="83" cy="26" r="5"/><circle cx="90" cy="26" r="5"/><circle cx="30" cy="96" r="4.5"/><circle cx="37" cy="96" r="4.5"/><circle cx="43" cy="100" r="4.5"/><circle cx="50" cy="100" r="4.5"/><circle cx="55" cy="104" r="4.5"/><circle cx="62" cy="104" r="4.5"/><circle cx="69" cy="104" r="4.5"/><circle cx="76" cy="104" r="4.5"/><circle cx="81" cy="100" r="4.5"/><circle cx="88" cy="100" r="4.5"/></g>
      <!-- arcane light leaking through the cracks -->
      <path d="M40 40 L50 56 L44 70 L54 88 M86 34 L78 52 L86 66" fill="none" stroke="#a894f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 40 L50 56 L44 70 L54 88 M86 34 L78 52 L86 66" fill="none" stroke="#dcd2ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- iron binding band -->
      <path d="M20 58 C44 64 84 64 108 58 L108 70 C84 76 44 76 20 70 Z" fill="#3c444d" stroke="#0b0d10" stroke-width="2.5"/>
      <path d="M24 61 C46 66 82 66 104 61" fill="none" stroke="#9aa3aa" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g><circle cx="34" cy="66" r="3" fill="#9aa3aa" stroke="#0b0d10" stroke-width="1.5"/><circle cx="64" cy="69" r="3" fill="#9aa3aa" stroke="#0b0d10" stroke-width="1.5"/><circle cx="94" cy="66" r="3" fill="#9aa3aa" stroke="#0b0d10" stroke-width="1.5"/></g>
    <path d="M64 16 C80 22 96 22 104 20 C106 56 96 90 64 114 C32 90 22 56 24 20 C32 22 48 22 64 16 Z" fill="none" stroke="#0b0d10" stroke-width="4" stroke-linejoin="round"/>
    <path d="M30 26 C40 26 52 24 62 20" fill="none" stroke="#f2d692" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <rect x="1.5" y="1.5" width="125" height="125" rx="5" fill="none" stroke="#0b0d10" stroke-width="3"/>
  </g>
</svg>
