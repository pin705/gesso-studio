<svg xmlns="http://www.w3.org/2000/svg" width="400" height="156" viewBox="0 0 400 156" data-type="button" data-style="cozy-farm" data-nine-slice="44 72 48 96">
  <defs>
    <filter id="btn-primary.disabled-wobble" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="btn-primary.disabled-soft" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="btn-primary.disabled-lip" x1="0" y1="30" x2="0" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8916f"/>
      <stop offset="1" stop-color="#6b5a45"/>
    </linearGradient>
    <linearGradient id="btn-primary.disabled-face" x1="0" y1="14" x2="0" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8c39c"/>
      <stop offset=".6" stop-color="#a8916f"/>
      <stop offset="1" stop-color="#6b5a45"/>
    </linearGradient>
    <radialGradient id="btn-primary.disabled-sun" cx="120" cy="30" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#efe1c2" stop-opacity=".15"/>
      <stop offset="1" stop-color="#efe1c2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="btn-primary.disabled-face-clip"><rect x="14" y="12" width="372" height="110" rx="30"/></clipPath>
  </defs>

  <rect x="16" y="22" width="368" height="122" rx="30" fill="#3a2414" opacity=".3" filter="url(#btn-primary.disabled-soft)"/>

  <g filter="url(#btn-primary.disabled-wobble)">
    <!-- outline backing (face + lip) -->
    <rect x="10" y="8" width="380" height="128" rx="34" fill="#3a2414"/>
    <!-- wooden lip -->
    <rect x="14" y="24" width="372" height="108" rx="30" fill="url(#btn-primary.disabled-lip)"/>
    <path d="M40 126 Q200 131 360 126" fill="none" stroke="#b98347" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <!-- painted face -->
    <g clip-path="url(#btn-primary.disabled-face-clip)">
      <rect x="14" y="12" width="372" height="110" fill="#efe1c2"/>
      <rect x="14" y="16" width="372" height="110" rx="30" fill="url(#btn-primary.disabled-face)"/>
      <rect x="14" y="12" width="372" height="110" fill="url(#btn-primary.disabled-sun)"/>
      <!-- wood grain showing through the paint -->
      <g fill="none" stroke="#6b5a45" stroke-width="1.6" stroke-linecap="round" opacity=".45">
        <path d="M30 48 C110 42 190 52 260 46 S350 44 372 50"/>
        <path d="M24 78 C90 84 170 74 240 80 S330 86 376 78"/>
        <path d="M36 102 C120 98 210 106 300 100"/>
      </g>
      <g fill="none" stroke="#efe1c2" stroke-width="1.4" stroke-linecap="round" opacity=".5">
        <path d="M60 30 C140 26 230 32 330 28"/>
        <path d="M150 62 C200 58 250 62 300 60"/>
      </g>
      <!-- brushed dry edge at the bottom of the face -->
      <path d="M14 112 C120 106 280 118 386 108 L386 126 L14 126 Z" fill="#6b5a45" opacity=".35"/>
    </g>
  </g>

  <!-- nails in the caps -->
  <g>
    <circle cx="352" cy="66" r="7" fill="#3a2414"/>
    <circle cx="352" cy="66" r="5" fill="#b98347"/>
    <circle cx="350.5" cy="64.5" r="1.8" fill="#f3d9a4"/>
  </g>

  <!-- leaf sprig ornament on the left cap -->
  <g stroke="#3a2414" stroke-width="2.5" stroke-linejoin="round">
    <path d="M40 30 C22 12 30 -2 52 6 C62 18 56 30 40 30 Z" fill="#efe1c2"/>
    <path d="M40 30 C58 22 78 26 84 40 C70 50 52 44 40 30 Z" fill="#d8c39c"/>
    <path d="M40 30 C28 40 20 54 26 66 C40 62 46 46 40 30 Z" fill="#efe1c2"/>
  </g>
  <g fill="none" stroke="#a8916f" stroke-width="1.4" stroke-linecap="round">
    <path d="M40 30 C42 20 46 12 50 8"/>
    <path d="M40 30 C54 32 66 36 80 40"/>
    <path d="M40 30 C34 42 30 52 27 62"/>
  </g>
  <g fill="none" stroke="#fbf4e3" stroke-width="1.6" stroke-linecap="round" opacity=".8">
    <path d="M34 20 C34 14 38 10 44 8"/>
    <path d="M30 46 C28 52 27 56 28 60"/>
  </g>
  <circle cx="40" cy="31" r="5.5" fill="#a8916f" stroke="#3a2414" stroke-width="2"/>
  <circle cx="38.6" cy="29.4" r="1.6" fill="#d8c39c"/>
</svg>
