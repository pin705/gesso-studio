<!doctype html>
<html data-type="panel" data-width="360" data-height="288" data-style="cozy-farm" data-nine-slice="56 52 56 52">
<head>
<link rel="stylesheet" href="/kit/gesso.css">
<style>
  :root { --outline: #3a2414; --ow: 3px; --shadow: rgba(58, 36, 20, .38); }
  .leaf { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#d9f0b0; --ow: 2.5px; }
  .nail { position:absolute; width:14px; height:14px; border-radius:50%; background: radial-gradient(circle at 38% 35%, #f3d9a4 0 2px, #b98347 3px, #8a5a2e 5px, #3a2414 6.5px); box-shadow: 0 2px 2px rgba(58,36,20,.4); }
  .wood { --c1:#3a2414; --c2:#5c3a1e; --c3:#8a5a2e; --c4:#b98347; --c5:#dcae6e; }
  .green { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#a8d77a; }
  .paper { --c1:#6b5a45; --c2:#a8916f; --c3:#d8c39c; --c4:#efe1c2; --c5:#fbf4e3; }
</style>
</head>
<body><div class="g-canvas">
  <div class="g-panel g-mat-wood wood" style="--radius:28px;--frame:24px;inset:10px 10px 18px">
    <div class="g-panel__content g-mat-paper paper" style="--radius:18px"></div>
  </div>
  <div class="nail" style="left:18px;top:18px"></div><div class="nail" style="left:328px;top:18px"></div>
  <div class="nail" style="left:18px;top:248px"></div><div class="nail" style="left:328px;top:248px"></div>
  <div class="g-icon leaf" style="--icon:url(/kit/icons/game-icons/oak-leaf.svg);inset:auto;left:286px;top:-6px;width:46px;height:46px;transform:rotate(40deg)"><i class="g-icon__base g-mat-paint"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div><div class="g-icon leaf" style="--icon:url(/kit/icons/game-icons/vine-leaf.svg);inset:auto;left:304px;top:8px;width:34px;height:34px;transform:rotate(95deg)"><i class="g-icon__base g-mat-paint"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div>
</div></body></html>
