<!doctype html>
<html data-type="button" data-width="400" data-height="156" data-style="cozy-farm" data-nine-slice="44 72 50 96">
<head>
<link rel="stylesheet" href="/kit/gesso.css">
<style>
  :root { --outline: #3a2414; --ow: 3px; --shadow: rgba(58, 36, 20, .38); }
  .leaf { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#d9f0b0; --ow: 2.5px; }
  .nail { position:absolute; width:14px; height:14px; border-radius:50%; background: radial-gradient(circle at 38% 35%, #f3d9a4 0 2px, #b98347 3px, #8a5a2e 5px, #3a2414 6.5px); box-shadow: 0 2px 2px rgba(58,36,20,.4); }
  .wood { --c1:#3a2414; --c2:#5c3a1e; --c3:#8a5a2e; --c4:#b98347; --c5:#dcae6e; }
  .green { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#a8d77a; }
  .paper { --c1:#6b5a45; --c2:#a8916f; --c3:#d8c39c; --c4:#efe1c2; --c5:#fbf4e3; }
</style>
</head>
<body><div class="g-canvas">
  <div class="g-button green is-disabled" style="--lip:11px;--radius:32px;--lip-color:linear-gradient(180deg,#8a5a2e,#5c3a1e);left:16px;right:16px;top:14px;bottom:36px">
    <div class="g-button__face g-mat-paint">
      <!-- painted inner border, like a sign-writer's line -->
      <div class="g-fill" style="inset:9px;border-radius:24px;border:2px solid rgba(217,240,176,.45);box-shadow:inset 0 -2px 0 rgba(31,61,28,.35)"></div>
    </div>
  </div>
  <div class="nail" style="left:350px;top:70px"></div>
  <div style="position:absolute;inset:0;transform:translateY(8px)">
    
    <div class="g-icon leaf" style="--icon:url(/kit/icons/game-icons/three-leaves.svg);inset:auto;left:4px;top:-6px;width:70px;height:70px;transform:rotate(-20deg)"><i class="g-icon__base g-mat-paint"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div>
    <div class="nail" style="left:36px;top:30px;background:radial-gradient(circle at 38% 35%,#f7b98f 0 2px,#d0543f 4px,#9b2e30 6px,#3a2414 7px)"></div>
  </div>
</div></body></html>
