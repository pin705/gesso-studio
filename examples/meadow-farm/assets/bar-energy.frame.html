<!doctype html>
<html data-type="bar" data-width="360" data-height="72" data-style="cozy-farm" data-nine-slice="20 28 20 76">
<head>
<link rel="stylesheet" href="/kit/gesso.css">
<style>
  :root { --outline: #3a2414; --ow: 3px; --shadow: rgba(58, 36, 20, .38); }
  .leaf { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#d9f0b0; --ow: 2.5px; }
  .nail { position:absolute; width:14px; height:14px; border-radius:50%; background: radial-gradient(circle at 38% 35%, #f3d9a4 0 2px, #b98347 3px, #8a5a2e 5px, #3a2414 6.5px); box-shadow: 0 2px 2px rgba(58,36,20,.4); }
  .wood { --c1:#3a2414; --c2:#5c3a1e; --c3:#8a5a2e; --c4:#b98347; --c5:#dcae6e; }
  .green { --c1:#1f3d1c; --c2:#2f5e27; --c3:#4a8a36; --c4:#74b44f; --c5:#a8d77a; }
  .paper { --c1:#6b5a45; --c2:#a8916f; --c3:#d8c39c; --c4:#efe1c2; --c5:#fbf4e3; }
</style>
</head>
<body><div class="g-canvas">
  <div class="g-mat-wood wood g-outline" style="position:absolute;left:12px;right:8px;top:12px;bottom:14px;--radius:24px;box-shadow:0 0 0 3px #3a2414,0 6px 8px rgba(58,36,20,.35)"></div>
  <div class="g-bar__track g-well wood" style="left:62px;right:22px;top:21px;bottom:24px;box-shadow:0 0 0 2px #3a2414, inset 0 4px 5px rgba(0,0,0,.6)"></div>
  <!-- sun badge on the cap -->
  <div class="g-icon" style="--icon:url(/kit/icons/game-icons/sun.svg);inset:auto;left:2px;top:2px;width:66px;height:66px;--c1:#6e4310;--c5:#fff6d0"><i class="g-icon__base g-mat-gold"></i><i class="g-icon__shade"></i><i class="g-icon__rim"></i></div>
</div></body></html>
