<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" data-type="mockup" data-style="cozy-farm">
  <defs>
    <linearGradient id="mockup-main-menu-sky" x1="0" y1="0" x2="0" y2="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9fd3e8"/><stop offset=".7" stop-color="#d6eff7"/><stop offset="1" stop-color="#fbf4e3"/></linearGradient>
    <filter id="mockup-main-menu-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="mockup-main-menu-energy"><rect x="94" y="120" width="156" height="30"/></clipPath>
  </defs>
  <!-- stand-in for the farm scene -->
  <rect width="540" height="960" fill="url(#mockup-main-menu-sky)"/>
  <g filter="url(#mockup-main-menu-blur)">
    <ellipse cx="120" cy="620" rx="340" ry="120" fill="#74b44f"/><ellipse cx="460" cy="640" rx="300" ry="110" fill="#4a8a36"/>
    <rect y="640" width="540" height="320" fill="#4a8a36"/>
    <g fill="#8a5a2e"><rect x="40" y="700" width="460" height="30" rx="12"/><rect x="40" y="770" width="460" height="30" rx="12"/><rect x="40" y="840" width="460" height="30" rx="12"/></g>
    <circle cx="430" cy="110" r="46" fill="#fff6d0"/>
  </g>
  <!-- HUD top: energy bar -->
  <image href="bar-energy.frame.svg" x="40" y="104" width="324" height="65"/>
  <image href="bar-energy.fill.svg" x="94" y="122" width="252" height="25" clip-path="url(#mockup-main-menu-energy)"/>
  <!-- title board -->
  <image href="panel-board.svg" x="60" y="200" width="420" height="336" preserveAspectRatio="none"/>
  <text x="270" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#5c3a1e">Meadow Farm</text>
  <text x="270" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8a5a2e">Day 12 · Spring</text>
  <image href="icon-wheat.svg" x="78" y="330" width="56" height="56"/><image href="icon-carrot.svg" x="140" y="330" width="56" height="56"/><image href="icon-coin.svg" x="202" y="330" width="56" height="56"/><image href="icon-watering-can.svg" x="264" y="330" width="56" height="56"/>
  <text x="270" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#6b5a45">Harvest ready: 24 wheat, 9 carrots</text>
  <!-- actions -->
  <image href="btn-primary.svg" x="70" y="600" width="400" height="156"/>
  <text x="290" y="678" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#fbf4e3" stroke="#3a2414" stroke-width="5" paint-order="stroke">Play</text>
  <image href="btn-primary.disabled.svg" x="120" y="760" width="300" height="117"/>
  <text x="285" y="818" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#fbf4e3" stroke="#6b5a45" stroke-width="4" paint-order="stroke">Market (Day 14)</text>
  <image href="vfx-harvest-sparkle.svg" x="330" y="300" width="160" height="160"/>
</svg>
