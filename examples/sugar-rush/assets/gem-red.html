<!doctype html>
<html data-type="icon" data-width="128" data-height="128" data-style="casual">
<head><link rel="stylesheet" href="/kit/gesso.css"><style>canvas { filter: drop-shadow(3px 0 0 #241640) drop-shadow(-3px 0 0 #241640) drop-shadow(0 3px 0 #241640) drop-shadow(0 -3px 0 #241640) drop-shadow(0 5px 0 rgba(36,22,64,.35)); }</style></head>
<body>
<script type="module">
import { defineAsset, threeStage } from '/kit/gesso.mjs';
import { gem } from '/kit/items.mjs';
defineAsset({
  async setup() {
    const stage = await threeStage({ distance: 5.6 });
    const piece = gem(stage.THREE, { color: 0xf74a9d, cut: 'round', glow: 0x241640 });
    piece.rotation.set(1.2, 0, 0.12); // match-3 pieces face the player: table toward the camera
    stage.scene.add(piece);
    return stage;
  },
  render(t, stage) { stage.render(); }
});
</script>
</body>
</html>
