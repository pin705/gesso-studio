<!doctype html>
<html data-type="icon" data-width="256" data-height="256" data-style="heroic-fantasy">
<head><link rel="stylesheet" href="/kit/gesso.css"></head>
<body>
<script type="module">
  import { defineAsset, threeStage } from '/kit/gesso.mjs';
  defineAsset({
    async setup() {
      const stage = await threeStage({ fov: 28, distance: 7.4 });
      stage.renderer.toneMappingExposure = 0.85;
      const { THREE, scene } = stage;
      // brilliant-cut gem: a flat-shaded lathe (table, crown, girdle, pavilion)
      const profile = [[0, 1.05], [0.62, 1.05], [1.12, 0.62], [1.2, 0.5], [1.2, 0.44], [0, -1.15]].map(([x, y]) => new THREE.Vector2(x, y));
      const geometry = new THREE.LatheGeometry(profile, 10).toNonIndexed();
      geometry.computeVertexNormals();
      const material = new THREE.MeshPhysicalMaterial({ color: 0xb00020, metalness: 0.15, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.02, ior: 1.77, specularIntensity: 1, specularColor: 0xffd6c8, flatShading: true, emissive: 0x4a0010, envMapIntensity: 1.6, sheen: 0.4, sheenColor: 0xff5040 });
      const gem = new THREE.Mesh(geometry, material);
      gem.rotation.set(0.42, 0.3, -0.12);
      scene.add(gem);
      // a warm glint light and a bounce so facets alternate light and dark
      // light passing through the stone: a warm glow on the far side
      const inner = new THREE.PointLight(0xff4a20, 18, 6);
      inner.position.set(0.6, -0.6, -0.4);
      scene.add(inner);
      const glint = new THREE.PointLight(0xfff0d0, 40, 20);
      glint.position.set(-2, 2.5, 3);
      scene.add(glint, new THREE.HemisphereLight(0xffe7d6, 0x2a0a10, 0.6));
      return { ...stage, gem };
    },
    render(t, { gem, render }) {
      gem.rotation.y = 0.3 + t * Math.PI * 2 / 4;
      render();
    }
  });
</script>
</body>
</html>
