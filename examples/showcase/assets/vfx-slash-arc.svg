<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384" data-type="vfx" data-style="heroic-fantasy" data-duration="0.5" data-frames="12">
  <defs>
    <radialGradient id="vfx-slash-arc-body" cx="192" cy="250" r="150" gradientUnits="userSpaceOnUse">
      <stop offset=".74" stop-color="#172f7a" stop-opacity="0"/>
      <stop offset=".84" stop-color="#2553b8" stop-opacity=".75"/>
      <stop offset=".93" stop-color="#4f86e8"/>
      <stop offset=".985" stop-color="#9cc2ff"/>
      <stop offset="1" stop-color="#dcebff"/>
    </radialGradient>
    <filter id="vfx-slash-arc-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="vfx-slash-arc-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <!-- sweep mask: the head draws on along the arc, then the tail erases toward the end tip -->
    <mask id="vfx-slash-arc-sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="384" height="384">
      <path d="M59 319.3 A148.84 148.84 0 1 1 338 215.7" fill="none" stroke="#fff" stroke-width="96" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
