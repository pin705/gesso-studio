      <path d="M59 319.3 A150 150 0 1 1 338 215.7 A150 150 0 0 0 59 319.3 Z" fill="#4f86e8" opacity=".55" filter="url(#vfx-slash-arc-glow)"/>
      <!-- body: white-hot cutting edge fading inward -->
      <path d="M59 319.3 A150 150 0 1 1 338 215.7 A150 150 0 0 0 59 319.3 Z" fill="url(#vfx-slash-arc-body)"/>
      <!-- white-hot rim cools off first -->
      <path d="M59 319.3 A150 150 0 1 1 338 215.7 A149.27 149.27 0 1 0 59 319.3 Z" fill="#dcebff" filter="url(#vfx-slash-arc-soft)">
        <animate attributeName="opacity" values="1;1;.2;0" keyTimes="0;.3;.6;1" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <animateTransform attributeName="transform" type="rotate" values="0 192 250;0 192 250;7 192 250" keyTimes="0;.22;1" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1" dur="0.5s" repeatCount="indefinite"/>
    </g>
    <!-- impact flash where the edge is thickest -->
