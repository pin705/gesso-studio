      </path>
    </mask>
  </defs>

  <g style="mix-blend-mode:screen">
    <!-- echo: a wider, fainter smear that trails the slash -->
    <g mask="url(#vfx-slash-arc-sweep)" opacity="0">
      <path d="M59 319.3 A150 150 0 1 1 338 215.7 A150 150 0 0 0 59 319.3 Z" fill="#2553b8" filter="url(#vfx-slash-arc-glow)" transform="rotate(-6 192 250) scale(1.04) translate(-8 -10)"/>
