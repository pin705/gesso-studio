name: Bug report
description: Something in Gesso does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what you got.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code 2.x, Codex, Cursor, Claude Desktop…
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Node version, browser used for rendering, Gesso version
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: SVG or logs
      description: For rendering problems attach the SVG. Server logs are in ~/.gesso/logs.
